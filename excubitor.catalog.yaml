# Excubitor catalog 断片 — このリポジトリが所有するサービス定義。
# Excubitor が ${ARS_ROOT} 配下を走査して集積する (Excubitor/catalog/FRAGMENTS.md)。
#
# 中央 catalog/services.yaml の撤去 (Excubitor: require service-owned definitions) に伴い、
# 旧 catalog にあった定義をそのまま移設したもの。
services:
  - code: aedilis
    name: Aedilis (施設予約)
    tier: saas
    project_code: aedilis
    component: server
    port: 17502
    repo: LUDIARS/Aedilis
    runtime: node
    cwd: ${ARS_ROOT}/Aedilis
    command: npm run dev
    allow_hot_reload: true
    autostart: false
    health:
      type: tcp
      interval_sec: 30
    provides:
      AEDILIS_URL: http://${host}:${port}
      AEDILIS_BASE_URL: http://${host}:${port}
    # Cernere (認証/ID) 発行のクライアント資格情報を Excubitor 経由で借りる (cross-service delegation)。
    # AEDILIS_CERNERE_CLIENT_ID/SECRET が Cernere の Infisical project に無ければ preflight が fail closed する。
    requires_secret:
      - service: cernere
        keys: [AEDILIS_CERNERE_CLIENT_ID, AEDILIS_CERNERE_CLIENT_SECRET]
